name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly rebuild so scheduled articles go live on time
  workflow_dispatch:
  repository_dispatch:
    types: [articles-changed]   # sent by the database when a live article changes (optional, see README)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4          # remembers translated pages between builds so only new text is translated
        with:
          path: data/translations.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-
      - run: pip install cryptography pillow
      - run: python build.py
        env:
          SPARK_PARTNER_PASSWORDS: ${{ secrets.SPARK_PARTNER_PASSWORDS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
